name: Android Google Play Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Negative patterns (evaluated in order) exclude DB-only
    # changes from triggering an app build. Migrations apply
    # manually via the Supabase SQL Editor and edge functions
    # deploy via `supabase functions deploy` — neither ships in
    # the app bundle, so a supabase/** or scripts/** commit must
    # NOT burn a build run. A MIXED commit that also touches
    # mobile/src/** still matches `mobile/**` and builds — only
    # pure DB/tooling commits are skipped.
    paths:
      - 'mobile/**'
      - '!mobile/supabase/**'
      - '!mobile/scripts/**'
      - '.github/workflows/android-google-play.yml'
  # Daily backstop, mirroring iOS. A `push` event is NOT a guarantee: on
  # 2026-08-06 GitHub accepted a push to main (ccd9ca4, 19:49:33Z — the
  # Vercel and Railway check suites were created for it) and never created
  # a GitHub Actions run at all. iOS recovered within 24h because it had
  # this cron; Android had only push + manual, so it would have stayed
  # stale indefinitely until a human noticed. That asymmetry is the reason
  # Android testers drift behind.
  #
  # This does NOT mean a build every night: the `gate` job below skips the
  # scheduled run whenever main is already the last successfully shipped
  # commit. It fires only when a push build is genuinely missing.
  schedule:
    - cron: '30 20 * * *'   # daily UTC 20:30 (TW 04:30) — backstop only

# Collapse bursts: rapid mobile pushes otherwise run concurrent builds that
# each open a Google Play "edit"; one committing deletes the others →
# "This Edit has been deleted." failures (2026-06-09). cancel-in-progress
# keeps only the latest push's build — which is also the one we want shipped
# (later commits on the same branch include the earlier ones). Mirrors the
# iOS workflow. Abandoned Play edits auto-expire, so cancelling is safe.
concurrency:
  group: android-google-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirror of the iOS gate — see ios-testflight.yml for the full rationale.
  #   workflow_dispatch — never gated, the on-demand escape hatch.
  #   push            — throttled to one build per COOLDOWN_SECONDS (24h).
  #   schedule        — builds only when main has moved since the last
  #                     successful build, so the nightly backstop never
  #                     re-uploads an unchanged commit to the internal track.
  # Fails OPEN throughout: any API error builds anyway. A silent skip is the
  # disease this gate exists to cure, so it must never be the cure's failure
  # mode.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Decide whether this run has anything new to ship
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # Same 24h cooldown as iOS (founder call 2026-09-08). Android runs
          # on Linux, so per build it is ~10x cheaper than iOS — but it was
          # the only workflow with NO push throttle at all, and volume made
          # up the difference: 33 runs over 2026-09-01..07 at ~29 min each
          # extrapolates to ~4,000 minutes a month, which is twice the entire
          # 2,000-minute free allowance on its own. Throttling iOS while
          # leaving this open would just move the overspend.
          COOLDOWN_SECONDS: '86400'
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # On-demand always builds — the escape hatch that makes the
          # cooldown safe.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "event=workflow_dispatch — on demand, no gate applied."
            exit 0
          fi

          # ── The last run that ACTUALLY SHIPPED ────────────────────────
          # (2026-09-09) This lookup used to be
          # `runs?status=success&per_page=1`, which is wrong in a way that
          # locked the pipeline shut. A run that hits the cooldown and skips
          # the build STILL CONCLUDES SUCCESS: the gate job succeeds and
          # build-and-upload comes back `skipped`. So every throttled
          # seven-second run reset the 24h clock, and with at least one push
          # a day the window never reopened — nothing built between
          # 2026-09-07 22:54 and this commit despite pushes every day.
          #
          # The backstop could not rescue it either: it compared the last
          # successful run's head_sha against main, and a throttled run
          # carries main's own sha, so it concluded the store already had a
          # commit the store had never seen. Both "independent recoveries"
          # rested on one false premise — that a successful RUN means a
          # shipped BUILD. This is exactly the silent-skip disease the gate
          # exists to cure, reintroduced by the cure.
          #
          # So: walk recent runs newest-first and take the first whose
          # build-and-upload job actually succeeded. Bounded at 30 and breaks
          # on the first hit. Still fails OPEN — an API error or no shipped
          # run on record leaves both values empty, and every caller below
          # treats empty as "build".
          #
          # Note there is NO status=success filter on the listing, and that
          # is deliberate. Run 1171 (2026-09-09) finished every step of
          # build-and-upload — archive, Export and Upload to TestFlight,
          # sourcemaps — and the job concluded SUCCESS, but a concurrency
          # cancellation landed after the work was done and stamped the RUN
          # cancelled. That build is in TestFlight. Filtering on the run's
          # conclusion would hide it and rebuild the same commit. The job is
          # the truth here; the run is a label that can lie in both
          # directions.
          RUNS_TSV=$(gh api \
            "repos/$REPO/actions/workflows/android-google-play.yml/runs?branch=$BRANCH&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.created_at) \(.head_sha)"' 2>/dev/null || true)
          SHIPPED_AT=""
          SHIPPED_SHA=""
          while IFS=' ' read -r RID RAT RSHA; do
            [ -n "$RID" ] || continue
            CONC=$(gh api "repos/$REPO/actions/runs/$RID/jobs" \
              --jq '.jobs[] | select(.name == "build-and-upload") | .conclusion' 2>/dev/null || true)
            if [ "$CONC" = "success" ]; then
              SHIPPED_AT="$RAT"
              SHIPPED_SHA="$RSHA"
              echo "Last real build: run $RID at $RAT ($RSHA)."
              break
            fi
          done <<< "$RUNS_TSV"
          if [ -z "$SHIPPED_AT" ]; then
            echo "No run with a successful build-and-upload in the last 30 successful runs (or the API was unavailable)."
          fi


          # push: throttle to at most one automatic build per cooldown window.
          # Nothing is lost — the next push past the window builds it, and the
          # daily backstop's "has main moved?" check below rescues it even if
          # no further push arrives.
          if [ "$EVENT_NAME" = "push" ]; then
            LAST_AT="$SHIPPED_AT"
            if [ -z "$LAST_AT" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "No run with a successful build on record (or the API was unavailable) — building. Fail open."
              exit 0
            fi
            LAST_EPOCH=$(date -u -d "$LAST_AT" +%s 2>/dev/null || echo "")
            NOW_EPOCH=$(date -u +%s)
            if [ -z "$LAST_EPOCH" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Could not parse '$LAST_AT' — building. Fail open."
              exit 0
            fi
            AGE=$(( NOW_EPOCH - LAST_EPOCH ))
            if [ "$AGE" -ge "$COOLDOWN_SECONDS" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Last successful build was ${AGE}s ago (>= ${COOLDOWN_SECONDS}s) — building."
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Last successful build was only ${AGE}s ago; cooldown is ${COOLDOWN_SECONDS}s."
              echo "These commits ship on the next push past the window, via the daily"
              echo "backstop, or immediately via workflow_dispatch."
            fi
            exit 0
          fi

          LAST_SHA="$SHIPPED_SHA"
          if [ -z "$LAST_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No run with a successful build on record (or the API was unavailable) — building. Fail open."
          elif [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "$BRANCH is still at $CURRENT_SHA, which Play already has."
            echo "Nothing to ship — skipping the backstop."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "$BRANCH moved: last shipped $LAST_SHA, now $CURRENT_SHA."
            echo "A push build is missing (dropped event?) — the backstop is rescuing it."
          fi

  build-and-upload:
    needs: gate
    # Fail open at the JOB level — same fix and same reasoning as the iOS
    # workflow. A gate job that never got a runner (failure, no steps) left
    # `should_build` unset, and `== 'true'` read that as "skip", so an infra
    # blip on a ten-second job silently skipped the whole release. `always()`
    # is what lets this run when the gate failed or was skipped. A gate that
    # actually runs and says 'false' still skips, so the "do not rebuild an
    # unchanged commit" saving is unaffected.
    if: always() && needs.gate.outputs.should_build != 'false'
    runs-on: ubuntu-latest
    # Raised 45 → 60. Successful Android runs cluster at 27–31 minutes
    # wall-clock (observed 22m52s … 30m41s), so 45 left barely 14 minutes of
    # headroom over a routine build — one slow Gradle or Sentry day and the
    # job gets killed. That kill is reported as "cancelled", i.e. it would
    # have looked exactly like the (unrelated) 2026-08-06 incident and sent
    # the next debugger hunting for a canceller that does not exist.
    # 60 is ~2x the worst observed run.
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Every Android build was resolving the full Gradle dependency graph
      # from Maven Central, and Maven Central rate-limits shared CI egress:
      # builds #843-#845 and #866-#867 all died on
      #   Could not GET '.../gson-2.9.1.pom'. Received status code 429
      # before compiling a line. A warm ~/.gradle means the common build
      # never asks Maven Central for anything.
      #
      # Keyed on mobile/package-lock.json, NOT on *.gradle files: this is an
      # Expo project, mobile/android/ does not exist in the repo and is
      # generated by `expo prebuild` further down — there are no gradle files
      # to hash at this point in the job. The native dependency graph is
      # derived from the JS one, so the lockfile is the honest key.
      # GitHub-hosted runners ship ~14GB free, and this job needs room for
      # the restored Gradle cache, an expo prebuild, and the AAB. #873 got
      # all the way to :app:packageReleaseBundle and died on
      #   java.io.IOException: No space left on device
      # These are preinstalled toolchains this build never touches. The
      # Android SDK and NDK are deliberately NOT removed — the RN build
      # needs them. df is printed either side so the next disk failure is
      # diagnosable instead of a guess.
      - name: Free runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          docker image ls -aq | xargs -r docker rmi -f || true
          echo "after:"; df -h / | tail -1

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Set Android versionCode
        working-directory: mobile
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Google Play rejects duplicate versionCodes. Use GitHub Actions
          # run_number (+1 offset so we never collide with pre-existing
          # build=1) as the Android versionCode. Matches the iOS buildNumber
          # strategy for consistency across platforms.
          VERSION_CODE=$((RUN_NUMBER + 1))
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = $VERSION_CODE;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "✅ Android versionCode set to $VERSION_CODE (run_number=$RUN_NUMBER)"
          # Export for later steps — Play Console releaseName must match
          # the real versionCode baked into the AAB, otherwise humans see
          # "build 87" in Play Console while devices upgrade to 88 and get
          # confused when auditing which build is actually live.
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          # Real versionName (expo.version) for the releaseName label — was
          # a stale hardcoded "1.0.0" while the app shipped 1.0.4.
          APP_VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/piktag-release.keystore

      - name: Build Android AAB
        working-directory: mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Allow Sentry upload to fail without blocking the build
          export SENTRY_ALLOW_FAILURE=true
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/mobile/android/app/piktag-release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
          || {
            # The retry exists for Sentry, but the failure we actually keep
            # hitting is a 429 from Maven Central. Retrying in the same
            # second hits the same limit — #867 failed twice in 68 seconds
            # for exactly that reason. Wait before the second attempt.
            echo "⚠️ Build failed. Waiting 60s, then retrying with Sentry upload disabled..."
            sleep 60
            export SENTRY_DISABLE_AUTO_UPLOAD=true
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=${{ github.workspace }}/mobile/android/app/piktag-release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          }

      - name: Upload AAB artifact
        # NON-BLOCKING on purpose. This is a debugging convenience — a copy
        # of the AAB kept on the run for a few days. Shipping to Play does
        # not need it. Run #826 proved why that matters: the AAB built
        # fine, this step then failed with "Artifact storage quota has been
        # hit", and because it was a hard link in the chain the actual
        # "Upload to Google Play" step was SKIPPED — a full archive bucket
        # stopped a release from reaching testers.
        # retention-days is trimmed from the 90-day default so the bucket
        # drains itself instead of needing a manual purge.
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 5

      - name: Upload JS sourcemaps to Sentry
        # Explicit sourcemap upload — Gradle's Sentry hook can be
        # disabled (SENTRY_DISABLE_AUTO_UPLOAD) by the build retry path
        # above, leaving releases without symbolication. Run sentry-cli
        # directly so every release has a sourcemap regardless.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: mobile
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          RELEASE="ag.pikt.app@${VERSION}+${VERSION_CODE}"
          mkdir -p dist
          npx expo export --platform android --output-dir dist || echo "⚠️ expo export failed — sourcemap upload may be partial"
          npx @sentry/cli sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE" \
            ./dist || echo "⚠️ sourcemap upload failed — non-fatal"

      - name: Generate release notes
        working-directory: mobile
        run: |
          # Feed the Play Console release with the latest commit subject
          # so every build has human-readable "What's new" text. Google
          # caps each locale at 500 chars — trim to be safe.
          #
          # r0adkll/upload-google-play parses the filename as
          # `whatsnew-<locale>` with NO extension — the entire suffix
          # after `whatsnew-` is treated as the locale code. Including
          # `.txt` would make it try to register a locale called
          # `en-US.txt`, which crashes with "Unrecognized language code".
          mkdir -p whatsnew
          COMMIT_SUBJECT=$(git log -1 --pretty=%s | head -c 490)
          printf '%s\n' "$COMMIT_SUBJECT" > whatsnew/whatsnew-en-US
          printf '%s\n' "$COMMIT_SUBJECT" > whatsnew/whatsnew-zh-TW
          echo "✅ Release notes written:"
          cat whatsnew/whatsnew-en-US

      - name: Upload to Google Play (Internal Track)
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ag.pikt.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          # `completed` = auto-rollout to 100% of the internal track, no
          # manual "Start rollout" click — this is why Android testers were
          # stuck on old versions (every build sat as a `draft`). The app
          # has already had its first human-approved rollout (testers have
          # it installed), so the "Precondition check failed" that forced
          # `draft` no longer applies. If a future run DOES fail on that
          # precondition, do ONE manual rollout in Play Console, then this
          # stays automatic.
          status: completed
          releaseName: "${{ env.APP_VERSION }} (build ${{ env.VERSION_CODE }})"
          whatsNewDirectory: mobile/whatsnew

      # See ios-testflight.yml for the full decision tree. "Cancelled" is
      # GitHub's badge for three unrelated events; print how to tell them
      # apart into the log of the run that is actually affected.
      - name: Explain a cancelled result
        if: cancelled()
        run: |
          echo "::error::This job ended as CANCELLED, not as an ordinary failure."
          echo "Three unrelated causes wear that same badge. To tell them apart:"
          echo "  1. timeout-minutes exceeded  — steps ran; the last one stalled at the limit."
          echo "  2. concurrency supersede     — a newer run of group android-google-play-${{ github.ref }} started."
          echo "  3. no runner ever assigned   — ZERO steps recorded and runner_name is empty."
          echo "     Case 3 is GitHub-side queue starvation (it hit this repo on 2026-08-06)."
          echo "     The job never starts, so this step never runs. If you are reading this"
          echo "     line at all, the cause is 1 or 2, not 3."
          echo "Confirm with:"
          echo "  gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \\"
          echo "    --jq '.jobs[]|{conclusion,runner_name,steps:(.steps|length)}'"
