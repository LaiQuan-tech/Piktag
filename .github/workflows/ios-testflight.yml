name: iOS TestFlight Build

on:
  # push to main + concurrency de-dupe + daily backstop + manual.
  #
  # History: "build on every push" once blew Apple's per-app DAILY
  # upload cap (~10+ separate pushes in a few hours → 10+ uploads →
  # "Upload limit reached"). The fix attempted next — schedule-only,
  # NO push — backfired badly: GitHub's `schedule` is best-effort
  # and silently didn't fire for a whole day, so ~18 commits of
  # fixes never built and TestFlight went stale with NO fallback.
  #
  # Correct fix = keep push (reliable, immediate) BUT add a
  # `concurrency` group with cancel-in-progress: a rapid burst of N
  # commits cancels the in-flight builds and only the LATEST one
  # finishes → ~1 upload per burst, not N. That structurally solves
  # the original cap problem without losing reliable delivery. The
  # daily cron stays as a pure backstop (if nothing pushed in a day,
  # still ship the latest); workflow_dispatch for on-demand.
  #
  # 2026-09-05: concurrency solved the Apple UPLOAD cap but not the
  # BILLING one. Cancellation only helps when the next push lands while
  # the previous build is still early; at 20-40 minutes apart each build
  # ran nearly to completion first, and macos-15 bills at 10x Linux
  # (~500 billed minutes per iOS build vs ~40 for all of Android). Seven
  # pushes in a day exhausted the org's whole Actions budget and every
  # workflow started dying before it reached a runner. The gate below now
  # applies a COOLDOWN to push events — see its comment. push stays a
  # trigger, deliberately: removing it is the thing that failed above.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/supabase/**'
      - '!mobile/scripts/**'
      - '.github/workflows/ios-testflight.yml'
  schedule:
    - cron: '30 20 * * *'   # daily UTC 20:30 (TW 04:30) — backstop only
  workflow_dispatch:          # on-demand manual run

# A burst of commits → cancel older in-flight builds, only the
# newest uploads. THIS is the real rate-limiter for the Apple cap
# (not a fragile schedule). queued/running builds for the same ref
# stream get superseded.
#
# The group key MUST be scoped to the ref. A concurrency group is a
# REPO-WIDE namespace, not a per-workflow one: a bare literal like
# `ios-testflight` is shared by every run that names it, so a
# workflow_dispatch (or any future branch build) on a DIFFERENT ref
# would cancel an in-flight main build. Adding github.ref confines
# cancellation to runs building the same ref. On main this is
# behaviourally identical to the old key — every push/schedule/
# dispatch on main still shares one key — so the burst-collapse that
# rate-limits Apple uploads is completely unchanged.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is there anything new to ship, and is it worth a macOS runner right now?
  #
  # workflow_dispatch is NEVER gated — it is the on-demand escape hatch and
  # must stay instant.
  # schedule is gated on "has main moved since the last successful build?"
  # push is gated on a COOLDOWN (added 2026-09-05, below).
  #
  # THE COOLDOWN. macos-15 bills at 10x the Linux rate, so one iOS build is
  # ~500 billed minutes against ~40 for the whole Android build. On
  # 2026-09-05 seven pushes to mobile/** in a day exhausted the org's entire
  # Actions budget and every workflow — including the ten-second i18n parity
  # check — started getting killed before it could reach a runner.
  # concurrency/cancel-in-progress did not save us: the pushes were 20-40
  # minutes apart, so each build ran nearly to completion before the next one
  # cancelled it, and cancelled macOS minutes are billed like any other.
  #
  # Note what is NOT being done here: removing the push trigger. That exact
  # fix was tried before and backfired — see the `on:` block. GitHub's
  # schedule is best-effort, it silently skipped a whole day, and ~18 commits
  # of fixes never built because nothing else could deliver them. A cooldown
  # keeps push as the reliable delivery path and only collapses BURSTS, which
  # is the thing that actually costs money.
  #
  # Nothing is lost when a push is throttled. Two independent recoveries:
  # the next push after the window builds it, and the daily backstop's
  # "has main moved?" check builds it if no further push arrives. Neither
  # depends on the other.
  #
  # Why this exists: the backstop was rebuilding and re-uploading the SAME
  # commit every single day (952e41f was rebuilt 07-27 … 08-04, nine days
  # running), and 8 of those 9 scheduled runs died at the very same step,
  # "Export and Upload to TestFlight". Re-shipping an unchanged commit
  # delivers nothing to testers, burns ~17 min of macOS runner time, spends
  # a slot against Apple's per-app DAILY upload cap, and — worst — puts a
  # red X on the repo every morning until nobody reads them any more.
  #
  # The backstop's real job is to rescue a push whose build never happened
  # (GitHub dropped the event outright on 2026-08-06). So the right question
  # is "does main differ from the last SUCCESSFULLY built commit?" — NOT
  # "did anything land in the last 24h", which would abandon a push whose
  # build was dropped three days ago.
  #
  # Fails OPEN by construction: any API error, or no successful run on
  # record, builds anyway. A silent skip is the exact disease this gate
  # exists to cure, so it must never be the failure mode of the cure.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Decide whether this run has anything new to ship
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # 3 hours. Long enough that a day of active iteration is a handful
          # of builds instead of one per push; short enough that a normal
          # working rhythm rarely notices it. workflow_dispatch bypasses it
          # entirely, so this throttles AUTOMATIC builds only.
          COOLDOWN_SECONDS: '10800'
          CURRENT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # On-demand always builds. This is what makes the cooldown safe:
          # whenever the founder wants a build NOW, one tap and it runs.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "event=workflow_dispatch — on demand, no gate applied."
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            LAST_AT=$(gh api \
              "repos/$REPO/actions/workflows/ios-testflight.yml/runs?status=success&branch=$BRANCH&per_page=1" \
              --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            if [ -z "$LAST_AT" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "No successful run on record (or the API was unavailable) — building. Fail open."
              exit 0
            fi
            LAST_EPOCH=$(date -u -d "$LAST_AT" +%s 2>/dev/null || echo "")
            NOW_EPOCH=$(date -u +%s)
            if [ -z "$LAST_EPOCH" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Could not parse '$LAST_AT' — building. Fail open."
              exit 0
            fi
            AGE=$(( NOW_EPOCH - LAST_EPOCH ))
            if [ "$AGE" -ge "$COOLDOWN_SECONDS" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Last successful build was ${AGE}s ago (>= ${COOLDOWN_SECONDS}s) — building."
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Last successful build was only ${AGE}s ago; cooldown is ${COOLDOWN_SECONDS}s."
              echo "Collapsing this burst. These commits ship on the next push past the"
              echo "window, or via the daily backstop, or immediately via workflow_dispatch."
            fi
            exit 0
          fi

          LAST_SHA=$(gh api \
            "repos/$REPO/actions/workflows/ios-testflight.yml/runs?status=success&branch=$BRANCH&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -z "$LAST_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No successful run on record (or the API was unavailable) — building. Fail open."
          elif [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "$BRANCH is still at $CURRENT_SHA, which TestFlight already has."
            echo "Nothing to ship — skipping the backstop instead of burning an Apple upload slot."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "$BRANCH moved: last shipped $LAST_SHA, now $CURRENT_SHA."
            echo "A push build is missing (dropped event?) — the backstop is rescuing it."
          fi

  build-and-upload:
    needs: gate
    # Fail open at the JOB level, not just inside the gate's script. Build
    # unless the gate positively said not to. `always()` is what lets this
    # run when the gate job itself failed or was skipped.
    #
    # Why: runs 31907532662 and its neighbours show `gate: failure,
    # runner_name: "", steps: 0` — GitHub never allocated a runner, so the
    # script never executed and could not fail open from the inside. With a
    # plain `== 'true'` an unset output meant "skip", so a transient infra
    # blip on a ten-second job silently skipped the entire release, twice in
    # a row, and the app-side fixes it was carrying never reached TestFlight.
    # Before this gate existed the same flakiness hit build-and-upload
    # directly, which at least showed up as a failed build.
    #
    # The Apple-upload-slot protection is intact: a gate that actually RUNS
    # and decides there is nothing new still emits 'false' and still skips.
    if: always() && needs.gate.outputs.should_build != 'false'
    # macos-15 is proven good: "Build iOS Archive" succeeds here and
    # the Xcode-26 gate passes (setup-xcode resolves Xcode 26 on this
    # image). The earlier "stuck at 574" was NOT a runner/Xcode issue
    # — it was Apple's per-app daily UPLOAD limit (~10+ builds/day
    # pushed; App Store Connect throttled: "Upload limit reached,
    # wait 1 day"). Keep the known-good runner.
    runs-on: macos-15
    # Successful iOS runs have taken 12m33s … 22m55s wall-clock (queue
    # included), so 60 is ~2.5x the worst observed case — enough headroom
    # that a slow-but-healthy build is never killed. Do NOT tighten this
    # toward the average: GitHub reports a timeout kill as "cancelled",
    # which is indistinguishable at a glance from a concurrency supersede
    # and sends the next debugger down the wrong path (see the
    # "Explain a cancelled result" step below).
    timeout-minutes: 60

    # EXPO_PUBLIC_* vars are substituted into the JS bundle by Metro at
    # bundle time and read by supabase.ts / googlePlaces.ts / ManageTagsScreen
    # at runtime. They MUST be present in the environment of both `npx expo
    # prebuild` and the xcodebuild archive step (which invokes Metro via the
    # React Native "Bundle React Native code and images" Xcode script phase).
    # Setting them at job level is the simplest way to propagate to every step.
    #
    # Required GitHub Actions secrets (add in repo Settings → Secrets → Actions):
    #   - EXPO_PUBLIC_SUPABASE_URL
    #   - EXPO_PUBLIC_SUPABASE_ANON_KEY
    #   - EXPO_PUBLIC_GOOGLE_PLACES_API_KEY
    # (Gemini API key now lives ONLY as a Supabase Edge Function secret —
    #  it never ships to the client bundle.)
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      # @v5 = Node 24 action runtime. GitHub force-migrates the
      # Node-20 runtime on 2026-06-02 and removes it 2026-09-16;
      # @v4 (Node 20) would break the pipeline after the cutover.
      # API-compatible bump — node-version below is the BUILD Node
      # (unrelated to the action's own runtime), left at 22.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Apple ITMS-90725: starting 2026-04-28 every iOS submission must be
      # built with Xcode 26 / iOS 26 SDK. The macos-15 runner image ships
      # multiple Xcode versions side-by-side; pin the active one explicitly
      # so the build doesn't silently fall back to whatever xcode-select
      # points at by default.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode + SDK version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          # Hard fail if the runner doesn't actually have Xcode 26 — better
          # to abort now than upload another rejected build.
          XCODE_MAJOR=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "❌ Xcode $XCODE_MAJOR.x is below 26 — App Store will reject this build (ITMS-90725)"
            echo "   Fix: bump runs-on to a newer macOS runner image, or set xcode-version explicitly"
            exit 1
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Write .env from job env (belt & suspenders)
        working-directory: mobile
        run: |
          # Some Expo CLI tools read from mobile/.env in addition to
          # process.env. Write the file explicitly so both paths work,
          # regardless of whether Metro picks up from process.env or .env.
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY=${EXPO_PUBLIC_GOOGLE_PLACES_API_KEY}
          EXPO_PUBLIC_SENTRY_DSN=${EXPO_PUBLIC_SENTRY_DSN}
          EOF
          # Fail loudly if any required secret is missing. Better to abort
          # now than produce a crashing release build.
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ Missing EXPO_PUBLIC_SUPABASE_* secrets — add them in GitHub Settings → Secrets → Actions"
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_GOOGLE_PLACES_API_KEY" ]; then
            echo "❌ Missing EXPO_PUBLIC_GOOGLE_PLACES_API_KEY — add it in GitHub Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ mobile/.env written from secrets"

      - name: Set iOS build number
        working-directory: mobile
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Use GitHub Actions run_number as the iOS CFBundleVersion.
          # This guarantees every CI build gets a unique, monotonically
          # increasing build number — Apple TestFlight rejects duplicates.
          # Offset by +1 so we never collide with any pre-existing build=1.
          BUILD_NUMBER=$((RUN_NUMBER + 1))
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.ios = app.expo.ios || {};
            app.expo.ios.buildNumber = String($BUILD_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "
          echo "✅ iOS buildNumber set to $BUILD_NUMBER (run_number=$RUN_NUMBER)"

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean

      - name: Configure Sentry (allow graceful failure)
        working-directory: mobile
        run: |
          # Create sentry.options.json so the Sentry Xcode build phase
          # doesn't exit 1 when the file is missing.
          cat > sentry.options.json << 'SJSON'
          {
            "dsn": "",
            "enableAutoSessionTracking": true
          }
          SJSON
          echo "✅ sentry.options.json created"

          # If SENTRY_AUTH_TOKEN is empty, disable Sentry upload in the
          # Xcode build phase by creating a .sentryclirc that skips it.
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "⚠️ SENTRY_AUTH_TOKEN is empty — Sentry upload will be skipped"
          fi

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Import signing certificate
        env:
          DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > $CERT_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          security import $CERT_PATH -P "$DISTRIBUTION_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add to keychain search list (prepend so it's found first)
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          echo "✅ Signing certificate imported"

      - name: Write App Store Connect API Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Find workspace name
        id: ws
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Found workspace: $WS, scheme: $SCHEME"

      - name: Build iOS Archive
        working-directory: mobile/ios
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set +e
          set -o pipefail
          xcodebuild archive \
            -workspace "${{ steps.ws.outputs.workspace }}" \
            -scheme "${{ steps.ws.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/mobile.xcarchive \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_KEY_ISSUER_ID }} \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=3NU6HAGX6Z \
            2>&1 | tee $RUNNER_TEMP/xcodebuild.log
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "========================================="
            echo "=== ACTUAL ERRORS (non-note lines)  ==="
            echo "========================================="
            grep -v "^note:" $RUNNER_TEMP/xcodebuild.log | grep -v "^$" | tail -80 || true
            echo "========================================="
            exit $BUILD_EXIT
          fi

      - name: Upload build log on failure
        if: failure()
        # continue-on-error so a full artifact bucket cannot mask the real
        # build failure this log exists to explain; retention trimmed from
        # the 90-day default so the bucket drains itself. This step is
        # already failure-only so, unlike Android's, it could never block a
        # release - but it eats the same quota.
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Export and Upload to TestFlight
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>3NU6HAGX6Z</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/mobile.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_API_KEY_ISSUER_ID }} \
            -allowProvisioningUpdates

          echo "✅ Upload to App Store Connect / TestFlight completed successfully"

      - name: Upload JS sourcemaps to Sentry
        # Belt-and-suspenders. The Sentry Xcode build phase already
        # uploads sourcemaps when SENTRY_AUTH_TOKEN is set, but it can
        # silently no-op (e.g. SENTRY_DISABLE_AUTO_UPLOAD=true). This
        # explicit step guarantees a sourcemap exists for every release
        # so production stack traces in Sentry stay symbolicated.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        working-directory: mobile
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BUILD_NUMBER=$((RUN_NUMBER + 1))
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          RELEASE="ag.pikt.app@${VERSION}+${BUILD_NUMBER}"
          mkdir -p dist
          npx expo export --platform ios --output-dir dist || echo "⚠️ expo export failed — sourcemap upload may be partial"
          npx @sentry/cli sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$RELEASE" \
            ./dist || echo "⚠️ sourcemap upload failed — non-fatal"

      # "Cancelled" is GitHub's badge for three completely different
      # events, and telling them apart is most of the diagnosis. Print the
      # decision tree into the log of the run that is actually affected.
      - name: Explain a cancelled result
        if: cancelled()
        run: |
          echo "::error::This job ended as CANCELLED, not as an ordinary failure."
          echo "Three unrelated causes wear that same badge. To tell them apart:"
          echo "  1. timeout-minutes exceeded  — steps ran; the last one stalled at the limit."
          echo "  2. concurrency supersede     — a newer run of group ios-testflight-${{ github.ref }} started."
          echo "  3. no runner ever assigned   — ZERO steps recorded and runner_name is empty."
          echo "     Case 3 is GitHub-side queue starvation (it hit this repo on 2026-08-06)."
          echo "     Nothing in this workflow file can prevent or detect it from inside the job:"
          echo "     the job never starts, so this step never even runs. If you are reading this"
          echo "     line at all, the cause is 1 or 2, not 3."
          echo "Confirm with:"
          echo "  gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \\"
          echo "    --jq '.jobs[]|{conclusion,runner_name,steps:(.steps|length)}'"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
