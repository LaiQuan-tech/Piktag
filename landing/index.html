<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-itunes-app" content="app-id=6761379641" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="PdzhF7KaWMp9U4aBN6CStZaTbPOEoYVuDL01wNtFL6Q" />
    <!-- Static fallback meta — JS replaces these per-locale once React mounts.
         See LocalizedDocumentMeta in src/main.tsx. The static values stay in
         English so crawlers and the pre-hydration first paint share the
         canonical brand voice. -->
    <meta name="description" content="Tag yourself. Find anyone you know — by what they actually do." />
    <meta name="keywords" content="social CRM, contact management, semantic tags, networking, PikTag" />
    <meta name="author" content="PikTag Team" />
    <meta property="og:title" content="PikTag — Tag yourself. Find anyone." />
    <meta property="og:description" content="Tag yourself. Find anyone you know — by what they actually do." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pikt.ag/" />
    <meta property="og:site_name" content="#PikTag" />
    <!-- The homepage had NO canonical and NO hreflang, while profile and
         tag pages have both. "/" renders in 19 languages behind ?lang= (and
         content-negotiates from Accept-Language), so without these a
         crawler saw many near-identical URLs, picked one, and dropped the
         rest as duplicates — the same defect the profile pages had.

         These are STATIC here on purpose: this shell is also what /contact,
         /pitch and /reset-password rewrite to, and those must all resolve
         to one canonical homepage rather than declaring themselves
         canonical. api/home.js only string-replaces title/OG/Twitter, so
         nothing rewrites these per request.

         Generated by scripts/gen-home-hreflang.cjs from the same
         LOCALE_CODES the server routes use, so the list cannot drift from
         the translation table. Re-run it if a locale is added. -->
    <link rel="canonical" href="https://pikt.ag/" />
    <!-- HREFLANG:START (generated — do not hand-edit) -->
    <link rel="alternate" hreflang="en" href="https://pikt.ag/?lang=en" />
    <link rel="alternate" hreflang="zh-TW" href="https://pikt.ag/?lang=zh-TW" />
    <link rel="alternate" hreflang="zh-CN" href="https://pikt.ag/?lang=zh-CN" />
    <link rel="alternate" hreflang="ja" href="https://pikt.ag/?lang=ja" />
    <link rel="alternate" hreflang="ko" href="https://pikt.ag/?lang=ko" />
    <link rel="alternate" hreflang="es" href="https://pikt.ag/?lang=es" />
    <link rel="alternate" hreflang="fr" href="https://pikt.ag/?lang=fr" />
    <link rel="alternate" hreflang="pt" href="https://pikt.ag/?lang=pt" />
    <link rel="alternate" hreflang="ru" href="https://pikt.ag/?lang=ru" />
    <link rel="alternate" hreflang="ar" href="https://pikt.ag/?lang=ar" />
    <link rel="alternate" hreflang="hi" href="https://pikt.ag/?lang=hi" />
    <link rel="alternate" hreflang="id" href="https://pikt.ag/?lang=id" />
    <link rel="alternate" hreflang="th" href="https://pikt.ag/?lang=th" />
    <link rel="alternate" hreflang="tr" href="https://pikt.ag/?lang=tr" />
    <link rel="alternate" hreflang="bn" href="https://pikt.ag/?lang=bn" />
    <link rel="alternate" hreflang="de" href="https://pikt.ag/?lang=de" />
    <link rel="alternate" hreflang="it" href="https://pikt.ag/?lang=it" />
    <link rel="alternate" hreflang="vi" href="https://pikt.ag/?lang=vi" />
    <link rel="alternate" hreflang="ur" href="https://pikt.ag/?lang=ur" />
    <link rel="alternate" hreflang="x-default" href="https://pikt.ag/" />
<!-- HREFLANG:END -->
    <!-- 2026-06-03: "summary" (not summary_large_image) — we share as a
         TEXT + LINK card by design (no OG image asset). summary_large_image
         would reserve a big image area and render it broken/empty without a
         twitter:image. og:title + og:description above already give FB / LINE
         a clean text unfurl; this keeps X/Twitter compact-text too. If a
         designed share image is added later, switch this back to
         summary_large_image and add og:image + twitter:image. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PikTag — Tag yourself. Find anyone." />
    <meta name="twitter:description" content="Tag yourself. Find anyone you know — by what they actually do." />
    <title>PikTag — Tag yourself. Find anyone.</title>
    <!-- Site-level structured data: who publishes this site, what the site
         is, and what the app is. Kept in the static shell (not injected by
         api/home.js) because /contact, /pitch and /reset-password rewrite
         straight to /app.html and never pass through that function.

         MIRRORS siteGraph() in api/_seo.js — that function is the source of
         truth for the server-rendered profile and tag pages, which reference
         these same @id values ("https://pikt.ag/#organization" and
         "https://pikt.ag/#website") so every page resolves to one publisher
         rather than declaring a new organization each time. If you change one
         of the two, change the other. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pikt.ag/#organization",
            "name": "PikTag",
            "legalName": "PikTag Inc.",
            "url": "https://pikt.ag/",
            "logo": { "@type": "ImageObject", "url": "https://pikt.ag/logo.png" },
            "email": "support@pikt.ag",
            "slogan": "Tag yourself. Find anyone.",
            "description": "PikTag is a contact app built on tags. You tag yourself with what describes you, and the people you meet become searchable by need instead of by name.",
            "sameAs": [
              "https://apps.apple.com/app/id6761379641",
              "https://play.google.com/store/apps/details?id=ag.pikt.app"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://pikt.ag/#website",
            "name": "PikTag",
            "url": "https://pikt.ag/",
            "publisher": { "@id": "https://pikt.ag/#organization" },
            "inLanguage": "en",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://pikt.ag/tag/{search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "MobileApplication",
            "@id": "https://pikt.ag/#app",
            "name": "PikTag",
            "operatingSystem": "iOS, Android",
            "applicationCategory": "SocialNetworkingApplication",
            "url": "https://pikt.ag/",
            "publisher": { "@id": "https://pikt.ag/#organization" },
            "installUrl": [
              "https://apps.apple.com/app/id6761379641",
              "https://play.google.com/store/apps/details?id=ag.pikt.app"
            ],
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
